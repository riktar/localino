name: macOS validation

# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Compile helpers through the development lifecycle
        run: npm run predev
      - name: Native gesture state machine (no physical input)
        run: ./out/native/Localino.Capture --self-test
      - run: npm run test:unit
      - run: npm run build:mac
      - name: Verify bundle signature
        run: |
          if [ "$(uname -m)" = "arm64" ]; then bundle=dist/mac-arm64/Localino.app; else bundle=dist/mac/Localino.app; fi
          codesign --verify --deep --strict --verbose=2 "$bundle"
      - name: Packaged Claude bridge integration
        run: node --test --test-timeout=60000 tests/bridge.test.mjs
        env:
          LOCALINO_TEST_PACKAGED: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localino-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7
